services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nestjs
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://admin:secret@db:5432/mydb?schema=public
      - PORT=3000
    depends_on:
      - db

  #  frontend:
  #    build:
  #      context: ./frontend
  #      dockerfile: Dockerfile
  #    container_name: react_frontend
  #    ports:
  #      - "5173:5173"
  #    volumes:
  #      - ./frontend:/usr/src/app
  #      - /usr/src/app/node_modules
  #    depends_on:
  #      - api

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: